# fly.toml — Fly.io deploy config for matchday-agent.
# Created via `fly launch --no-deploy` on 2026-07-26 (Phase 5), starting
# from the Phase 0 draft. Full rationale in docs/decisions.md § 0.6 + § 5.x.

app = 'matchday-agent'

# Phase 5 choice: `iad` (Ashburn, VA). Supabase Postgres lives in
# `ca-central-1` (Montreal). `iad` is ~1000 km from Montreal vs. ~2500 km
# for `mia` — cuts checkpointer + pgvector RTT roughly in half. `iad` is
# also close to Vercel's edge for the `matchday-mcp-web` frontend.
primary_region = 'iad'

[build]
  dockerfile = 'Dockerfile'

[env]
  # Non-secret runtime config. Secrets live in `fly secrets set` (see
  # docs/decisions.md § 0.6 for the 6-secret table).
  PORT = '8080'
  LOG_LEVEL = 'info'
  # LangSmith auto-instrumentation requires this alongside LANGSMITH_API_KEY
  # (which is a secret). See docs/decisions.md § 0.9.
  LANGSMITH_TRACING = 'true'
  # Explicit LLM defaults so a provider swap is a one-line fly.toml edit
  # (or a `fly secrets set` override) + redeploy — no code change per § 3.6.
  LLM_PROVIDER = 'groq'
  LLM_MODEL = 'llama-3.3-70b-versatile'
  # RAG re-enabled after § 8.10 model swap complete: embedder is now
  # paraphrase-multilingual-MiniLM-L12-v2 (~220 MB, 384-dim) pre-baked
  # into the image, corpus re-ingested in Supabase with the new dim,
  # HNSW rebuilt with vector_cosine_ops. VM bumped to 1 GB (see [[vm]]).
  RAG_ENABLED = 'true'

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = 'stop'     # Cost-safe: scale to zero when idle.
  auto_start_machines = true
  min_machines_running = 0
  processes = ['app']

  # KNOWN LIMITATION (docs/decisions.md § 0.6): idle SSE streams do NOT
  # keep the machine awake. Fly Proxy scores load on inbound HTTP only.
  # OK for v1 (anchor use cases complete in < 30 s).

  [http_service.concurrency]
    type = 'requests'             # Modern default (deprecated: `connections`).
    hard_limit = 20
    soft_limit = 10

  [[http_service.checks]]
    grace_period = '15s'          # Room for Python cold-start.
    interval = '30s'
    method = 'GET'
    path = '/health'
    timeout = '5s'

[[vm]]
  size = 'shared-cpu-1x'
  memory = '1gb'                  # Bumped from 512 MB per decisions.md § 8.10
                                  # audit response: paraphrase-multilingual-MiniLM-L12-v2
                                  # embedder (~220 MB in ORT) + Python runtime
                                  # + Node MCP subprocess + pgvector queries
                                  # need headroom. Original 512 MB OOM-killed
                                  # the first RAG call (§ 8.9 diagnosis).
